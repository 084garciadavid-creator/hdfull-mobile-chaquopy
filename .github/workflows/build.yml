name: Build HDFull WebView+Proxy Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build release APK
        run: gradle assembleRelease --stacktrace
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false

      - name: Verificar APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          unzip -l "$APK" | grep -i "LocalVideoProxy" | head -3 || echo "SIN LocalVideoProxy"
          unzip -l "$APK" | grep -i "WebViewVideoInterceptor" | head -3 || echo "SIN WebViewVideoInterceptor"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: hdfull-webview-proxy-release
          path: app/build/outputs/apk/release/*.apk
