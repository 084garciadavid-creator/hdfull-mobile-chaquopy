name: Build HDFull Chaquopy Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python (for Chaquopy build tools)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Build release APK (online, con Chaquopy)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false

      - name: Verificar Chaquopy en el APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          unzip -l "$APK" | grep -i "libpython" | head -5 || echo "SIN libpython"
          unzip -l "$APK" | grep -i "alfa_bridge" | head -5 || echo "SIN alfa_bridge"
          unzip -l "$APK" | grep -i "chaquo" | head -5 || echo "SIN chaquo"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: hdfull-chaquopy-release
          path: app/build/outputs/apk/release/*.apk
